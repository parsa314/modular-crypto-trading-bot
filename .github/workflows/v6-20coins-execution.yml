name: v6 fixed twenty real Binance historical experiment
on:
  push:
    branches: ["research/btcusdt-m15-real-backtest-20261014"]
    paths:
      - ".github/workflows/v6-20coins-execution.yml"
      - "scripts/run_v6_20coins.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-real-prices:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Numeric-only Binance Spot 2022/2024 then gated first-look Test-3
        run: python scripts/run_v6_20coins.py
      - name: Publish numbers (even on validation failure)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v6_2022.json results/v6_20coins.json
          if [ -f results/v6_test3.json ]; then git add results/v6_test3.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results(v6): measured 20-coin bear and bull Sharpe, gated Test3 outcome"
          git push origin "HEAD:research/btcusdt-m15-real-backtest-20261014"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-twenty-coin-measured-results
          path: |
            results/v6_2022.json
            results/v6_20coins.json
            results/v6_test3.json
          if-no-files-found: warn
