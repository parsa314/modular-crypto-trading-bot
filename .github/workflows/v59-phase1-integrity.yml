name: v59 phase1 rebuild integrity

on:
  push:
    branches:
      - research/v59-nextgen-architecture-20261002
    paths:
      - 'research_bot/v59/**'
      - 'tests/v59/**'
      - 'configs/v59_nextgen_research.yaml'
      - 'docs/v59/**'
      - '.github/workflows/v59-phase1-integrity.yml'
  pull_request:
    paths:
      - 'research_bot/v59/**'
      - 'tests/v59/**'
      - 'configs/v59_nextgen_research.yaml'
      - 'docs/v59/**'
      - '.github/workflows/v59-phase1-integrity.yml'

permissions:
  contents: read

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
      BOT_FORWARD_PAPER_ENABLED: 'false'
      BOT_PAPER_EXECUTION_ENABLED: 'false'
      EXECUTION_MODE: RESEARCH_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Compile V59
        run: python -m compileall -q research_bot/v59 tests/v59
      - name: V59 focused integrity suite
        run: python -m pytest -q tests/v59
      - name: Deterministic V59 kernel replay twice
        run: |
          rm -rf /tmp/v59-a /tmp/v59-b
          python -m research_bot.v59 integrity-demo --output /tmp/v59-a
          python -m research_bot.v59 integrity-demo --output /tmp/v59-b
          diff -r /tmp/v59-a /tmp/v59-b
      - name: Full repository regression suite
        run: python -m pytest -q
