name: Real bot architecture — demo-only engineering
on:
  push:
    branches: ["engineering/paper-trading-20261015"]
    paths:
      - "src/**"
      - "scripts/test_mt5_connection.py"
      - "scripts/train_primary_ml.py"
      - "scripts/run_cpcv.py"
      - "scripts/verify_real_bot_artifacts.py"
      - "tests/test_mt5_broker.py"
      - "tests/test_primary_ml.py"
      - "tests/test_signal_rl.py"
      - "tests/test_real_cpcv.py"
      - "pyproject.toml"
      - ".github/workflows/real-bot-engineering.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-bot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  demo-broker-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]' mt5forge==1.0.3
      - run: python -m compileall -q src/adapters/mt5_broker.py scripts/test_mt5_connection.py
      - name: Demo-only and async boundary contracts (does not claim terminal connectivity)
        run: python -m pytest -q tests/test_mt5_broker.py
  primary-ml-contract-and-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,validation]' xgboost-cpu==3.4.1 hmmlearn==0.3.3
      - run: python -m pytest -q tests/test_primary_ml.py
      - name: Reproduce native model precision, OOF admission and measured equity
        run: python -m scripts.verify_real_bot_artifacts --phase 2
