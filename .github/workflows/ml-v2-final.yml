name: Final ML v2 public Binance H4 D1 experiment
on:
  push:
    branches: ["research/final-ml-rl-20261017"]
    paths:
      - "scripts/ml_v2_final.py"
      - "tests/test_ml_v2_final.py"
      - ".github/workflows/ml-v2-final.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  historic-h4-daily-then-val2023:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install classifiers, HMM and numerical infrastructure
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'pyarrow>=16,<25' 'scikit-learn>=1.5,<2' 'xgboost>=3,<4' 'lightgbm>=4,<5' 'catboost>=1.2,<2' 'hmmlearn>=0.3,<0.4' 'pytest>=8,<10'
      - name: Check overlap labeling and sealed held-out dates
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/test_ml_v2_final.py
      - name: Fetch real H4 D1 histories and compute 2023 nested validation
        env:
          PYTHONPATH: "src:."
        run: python scripts/ml_v2_final.py
      - name: Save numeric results and authentic signal rows
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ml_v2_comparison.json results/ml_v2_signals.parquet
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results(ml-v2): real 50-symbol H4 D1 2019-23 nested CV AUC and weights"
          git push origin HEAD:research/final-ml-rl-20261017
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-ml-v2-2023-validation
          path: |
            results/ml_v2_comparison.json
            results/ml_v2_signals.parquet
          if-no-files-found: warn
