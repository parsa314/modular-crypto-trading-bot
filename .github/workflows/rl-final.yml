name: RL PPO SAC four real H4 spot experiments
on:
  push:
    branches: ["research/final-rl-20261017"]
    paths:
      - "scripts/rl_final_experiment.py"
      - "tests/test_rl_final.py"
      - ".github/workflows/rl-final.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare-real-h4:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RL training and data dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "pyarrow>=16,<25" "scikit-learn>=1.5,<2" "hmmlearn>=0.3,<0.4" "gymnasium>=1,<2" "stable-baselines3>=2.5,<3" "pytest>=8,<10"
      - name: Verify risk-free read-only Gym environment
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/test_rl_final.py
      - name: Download actual Spot public H4 histories (2019-2023 only)
        env:
          PYTHONPATH: "src:."
        run: python scripts/rl_final_experiment.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: rl-public-h4-data
          path: |
            results/rl_h4_50_2019_2023.parquet
            results/rl_data_manifest.json
          if-no-files-found: error
  train-algorithms:
    needs: prepare-real-h4
    strategy:
      fail-fast: false
      matrix:
        algorithm: ["PPO","SAC"]
        seed: [42,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RL dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "pyarrow>=16,<25" "scikit-learn>=1.5,<2" "hmmlearn>=0.3,<0.4" "gymnasium>=1,<2" "stable-baselines3>=2.5,<3"
      - uses: actions/download-artifact@v4
        with:
          name: rl-public-h4-data
          path: results
      - name: Run full training, not smoke training
        env:
          PYTHONPATH: "src:."
        run: python scripts/rl_final_experiment.py train --algorithm ${{ matrix.algorithm }} --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: rl-run-${{ matrix.algorithm }}-${{ matrix.seed }}
          path: |
            results/rl_*_seed*.json
            models/*_agent_seed*.zip
          if-no-files-found: error
  aggregate-real-results:
    needs: [prepare-real-h4,train-algorithms]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "pyarrow>=16,<25" "scikit-learn>=1.5,<2" "hmmlearn>=0.3,<0.4" "gymnasium>=1,<2" "stable-baselines3>=2.5,<3"
      - uses: actions/download-artifact@v4
        with:
          name: rl-public-h4-data
          path: results
      - uses: actions/download-artifact@v4
        with:
          pattern: rl-run-*
          merge-multiple: true
      - name: Measure PPO SAC seed Sharpe vs fixed and BTC
        env:
          PYTHONPATH: "src:."
        run: python scripts/rl_final_experiment.py aggregate
      - name: Commit actual measured results and models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/rl_*.json results/rl_h4_50_2019_2023.parquet models/*_agent_seed*.zip
          git commit -m "results(rl): PPO SAC 500k per run and fixed/BTC 2023 Sharpe"
          git push origin HEAD:research/final-rl-20261017
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rl-final-2023-numbers
          path: results/rl_final.json
          if-no-files-found: warn
