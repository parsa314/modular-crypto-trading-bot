name: r12-closure-validation
on:
  push:
    branches: ["fix/r12-durable-fee-precision-007"]
  pull_request:
    branches: ["fix/r1-financial-boundary-006"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v52:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: execution_v52
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d execution_v52"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci-only@127.0.0.1:5432/execution_v52
      RECOVERY_TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci-only@127.0.0.1:5432/recovery_test
      NEXT_GATE_ISOLATED_DATABASE: "1"
      LIVE_EXECUTION: "false"
      PAPER_EXECUTION: "false"
      BOT_FORWARD_PAPER_ENABLED: "false"
      BOT_PAPER_EXECUTION_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Record environment and create isolated recovery database
        timeout-minutes: 2
        run: |
          mkdir -p artifacts/closure-v52
          git rev-parse HEAD | tee artifacts/closure-v52/source-sha.txt
          python --version 2>&1 | tee artifacts/closure-v52/python-version.txt
          python -m pip freeze > artifacts/closure-v52/environment.txt
          python - <<'PY'
          import os, psycopg
          from pathlib import Path
          with psycopg.connect(os.environ["TEST_DATABASE_URL"], autocommit=True, connect_timeout=5) as conn:
              row = conn.execute("SELECT version(), current_database()").fetchone()
              assert row[1] == "execution_v52"
              conn.execute("CREATE DATABASE recovery_test")
          Path("artifacts/closure-v52/postgres-identity.txt").write_text(str(row))
          PY
      - name: Test with PostgreSQL allowed and all other external connections rejected
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          pg_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ${{ job.services.postgres.id }})"
          python -c 'import ipaddress,sys; assert ipaddress.ip_address(sys.argv[1]).is_private' "$pg_ip"
          sudo iptables -I OUTPUT 1 -j REJECT
          trap 'sudo iptables -D OUTPUT -j REJECT' EXIT
          sudo iptables -I OUTPUT 1 -d 127.0.0.0/8 -j ACCEPT
          trap 'sudo iptables -D OUTPUT -d 127.0.0.0/8 -j ACCEPT; sudo iptables -D OUTPUT -j REJECT' EXIT
          sudo iptables -I OUTPUT 1 -d "$pg_ip" -p tcp --dport 5432 -j ACCEPT
          trap 'sudo iptables -D OUTPUT -d "$pg_ip" -p tcp --dport 5432 -j ACCEPT; sudo iptables -D OUTPUT -d 127.0.0.0/8 -j ACCEPT; sudo iptables -D OUTPUT -j REJECT' EXIT
          sudo ip6tables -I OUTPUT 1 ! -d ::1/128 -j REJECT
          trap 'sudo ip6tables -D OUTPUT ! -d ::1/128 -j REJECT; sudo iptables -D OUTPUT -d "$pg_ip" -p tcp --dport 5432 -j ACCEPT; sudo iptables -D OUTPUT -d 127.0.0.0/8 -j ACCEPT; sudo iptables -D OUTPUT -j REJECT' EXIT
          python - <<'PY'
          import os, psycopg
          for key in ("TEST_DATABASE_URL", "RECOVERY_TEST_DATABASE_URL"):
              with psycopg.connect(os.environ[key], connect_timeout=5) as conn:
                  print("FIREWALL_POSTGRES_PREFLIGHT", key, conn.execute("SELECT current_database()").fetchone()[0], flush=True)
          PY
          python -m pytest -vv --junitxml=artifacts/closure-v52/junit.xml tests/checks_pg_recovery.py tests/test_r12_nobitex_decimal.py tests/test_r12_unknown_fee.py tests/test_execution_hardening_v52.py tests/test_execution_hardening_postgres_v52.py tests/test_order_reconciliation_v52.py tests/test_live_readiness.py tests/test_testnet_execution.py tests/test_okx_demo_transport.py tests/test_nobitex_testnet_transport.py tests/test_forward_paper_v14.py tests/test_v08_orchestrator.py tests/test_recovery_acceptance.py tests/test_operational_risk.py tests/test_release_control.py tests/test_next_gate_risk_validation.py tests/test_next_gate_postgres.py tests/test_p0_correctness_postgres.py 2>&1 | tee artifacts/closure-v52/pytest.log
      - name: Hash evidence
        if: always()
        run: |
          mkdir -p artifacts/closure-v52
          find artifacts/closure-v52 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > artifacts/closure-v52/SHA256SUMS
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closure-v52-${{ github.sha }}
          path: artifacts/closure-v52/
          if-no-files-found: warn
  repository:
