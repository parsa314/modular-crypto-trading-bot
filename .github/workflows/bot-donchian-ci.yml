name: H4 Donchian real-archive paper execution
on:
  push:
    branches: ["engineering/h4-donchian-paper-20261017"]
    paths:
      - "src/bot/**"
      - "start.sh"
      - "monitor.sh"
      - "requirements-bot.txt"
      - "tests/test_bot_donchian.py"
      - ".github/workflows/bot-donchian-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproducible-real-parquet-paper-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime packages
        run: python -m pip install -r requirements-bot.txt
      - name: Test public-only H4 paper broker and authentic candle replay
        env:
          PYTHONPATH: src
        run: python -m pytest -q -rs tests/test_bot_donchian.py
      - name: Run real checked archive independent smoke process
        env:
          PYTHONPATH: src
        run: |
          chmod +x start.sh monitor.sh
          ./start.sh src/bot/config.replay.yaml | tee bot_replay_stdout.txt
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('logs/bot-replay/state.json').read_text())
          print(f"REAL_ARCHIVE_PAPER_NAV={s['nav']:.6f}")
          print(f"REAL_ARCHIVE_PAPER_TRADES={s['trades']}")
          print(f"REAL_ARCHIVE_PAPER_ERRORS={s['errors']}")
          assert not s["halted"] and s["errors"]==0
          files=list(Path('logs/bot-replay').glob('*.jsonl'))
          assert files and any('"event": "PAPER_CYCLE"' in p.read_text() for p in files)
          PY
          bash -n start.sh monitor.sh
      - name: Upload proof — stdout, persisted state and true candle replay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donchian-h4-publisher-verified-btc-paper-run
          path: |
            bot_replay_stdout.txt
            logs/bot-replay/state.json
            logs/bot-replay/*.jsonl
          if-no-files-found: warn
