name: nobitex-testnet-readonly-preflight

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Unified market symbol
        required: true
        default: BTC/USDT

permissions:
  contents: read

jobs:
  readonly-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOBITEX_TESTNET_ENABLED: "true"
      NOBITEX_TESTNET_TOKEN: ${{ secrets.NOBITEX_TESTNET_TOKEN }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Require testnet-only credential
        run: |
          set -euo pipefail
          test -n "$NOBITEX_TESTNET_TOKEN"

      - name: Run read-only Nobitex TESTNET preflight
        run: |
          python scripts/nobitex_testnet_preflight.py --symbol "${{ inputs.symbol }}"
