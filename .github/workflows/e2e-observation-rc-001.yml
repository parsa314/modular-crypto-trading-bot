name: e2e-observation-rc-001
on:
  push:
    branches: ["feat/e2e-observation-rc-001-20261105"]
  pull_request:
    paths:
      - "research_bot/e2e_observer.py"
      - "tests/test_e2e_observer_unittest.py"
      - ".github/workflows/e2e-observation-rc-001.yml"
permissions:
  contents: read
jobs:
  observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run observation tests
        run: python -m unittest discover -s tests -p 'test_e2e_observer_unittest.py' -v
  public-coinex-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: mkdir -p artifacts
      - name: Attempt public read-only CoinEx observation
        shell: bash
        run: |
          set -o pipefail
          python -m research_bot.e2e_observer --db artifacts/observation.sqlite --symbol BTC/USDT | tee artifacts/observation.json
      - name: Upload result or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinex-observation-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
