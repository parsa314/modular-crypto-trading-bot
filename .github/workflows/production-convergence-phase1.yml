name: production-convergence-phase1
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
      BOT_FORWARD_PAPER_ENABLED: 'false'
      BOT_PAPER_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install -e '.[dev,data]' 'pyyaml>=6,<7'
      - name: Compile
        run: python -m compileall -q research_bot scripts
      - name: Focused safety and adversarial tests
        run: python -m pytest -q tests/test_risk_constitution.py tests/test_live_ledger.py tests/test_convergence*.py tests/v59/test_convergence*.py
      - name: Full regression
        run: python -m pytest -q
      - name: Fake-only failure replay
        run: python -m research_bot.v59.convergence_replay --output artifacts/phase1-fake-replay
      - name: Configuration and workflow validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from research_bot.execution.constitution import RISK_CONSTITUTION_V1 as R, RiskConstitution
          from research_bot.execution.config import GovernanceConfig
          from research_bot.execution.rl_policy import TradingEnvConfig
          assert RiskConstitution.from_json(R.canonical_json()).sha256 == R.sha256
          assert GovernanceConfig().risk_constitution_hash == TradingEnvConfig().risk_constitution_hash == R.sha256
          for p in Path('.github/workflows').glob('*.yml'):
              assert isinstance(yaml.safe_load(p.read_text()), dict)
          print('risk and workflow contracts: PASS')
          PY
      - name: Secret hygiene
        run: |
          ! git ls-files | grep -E '(^|/)\.env($|\.)'
          ! git grep -n -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- ':!*.md'
