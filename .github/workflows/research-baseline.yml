name: research-baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research_bot/**"
      - "scripts/**"
      - "tests/**"
      - "notebooks/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/research-baseline.yml"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Real-market baseline
        run: python scripts/run_baseline.py --exchange coinex --symbol BTC/USDT --timeframe 4h --limit 3000 --fee-bps 10 --slippage-bps 2 --output artifacts/baseline_report.json
      - name: v0.2 replication component test
        run: python scripts/run_replication_v02.py --exchange coinex --symbol BTC/USDT --timeframe 4h --limit 3000 --fee-bps 10 --slippage-bps 2 --output artifacts/replication_v02_report.json
      - name: v0.3 deep-history data and alpha ingestion
        run: python scripts/run_alpha_data_v03.py --symbol BTC/USDT --bars 15000 --period 4hour --funding-days 2500 --basis-days 365 --trade-pages 5 --output-dir artifacts/v03
      - name: v0.4 historical archive and alpha ablation
        run: python scripts/run_ablation_v04.py --v03-dir artifacts/v03 --output-dir artifacts/v04 --archive-start-month 2023-09 --oi-days 365 --fee-bps 10 --slippage-bps 2 --threshold 0.56
      - name: v0.5 regime-conditional alpha and robustness
        run: python scripts/run_regime_v05.py --v04-dir artifacts/v04 --output-dir artifacts/v05 --fee-bps 10 --slippage-bps 2 --bootstrap-runs 700
      - name: v0.6 cross-sectional perpetuals and independent OI confirmation
        run: python scripts/run_cross_sectional_v06.py --start-month 2022-01 --output-dir artifacts/v06 --fee-bps 4 --slippage-bps 2
      - name: Upload research reports
        uses: actions/upload-artifact@v7
        with:
          name: research-reports-v06
          path: |
            artifacts/baseline_report.json
            artifacts/replication_v02_report.json
            artifacts/v03/**
            artifacts/v04/**
            artifacts/v05/**
            artifacts/v06/**
