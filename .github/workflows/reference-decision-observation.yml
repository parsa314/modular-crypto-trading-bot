name: reference-decision-observation
on:
  push:
    branches: ["research/reference-decision-observation-20261110"]
  pull_request:
    paths:
      - "research_bot/e2e_observer.py"
      - "tests/test_e2e_observer_unittest.py"
      - ".github/workflows/reference-decision-observation.yml"
permissions:
  contents: read
jobs:
  observation-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_e2e_observer_unittest.py' -v
      - run: python -m unittest discover -s tests -p 'test_forward_observer_002.py' -v
