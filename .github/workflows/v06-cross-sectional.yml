name: v06-cross-sectional

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research_bot/cross_sectional_v06.py"
      - "scripts/run_cross_sectional_v06.py"
      - "tests/test_cross_sectional_v06.py"
      - ".github/workflows/v06-cross-sectional.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: v0.6 focused tests
        run: pytest -q tests/test_cross_sectional_v06.py
      - name: v0.6 cross-sectional research
        run: python scripts/run_cross_sectional_v06.py --start-month 2022-01 --output-dir artifacts/v06 --fee-bps 4 --slippage-bps 2 --max-workers 6
      - name: Upload v0.6 artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v06-cross-sectional-results
          path: artifacts/v06/**
          if-no-files-found: warn
