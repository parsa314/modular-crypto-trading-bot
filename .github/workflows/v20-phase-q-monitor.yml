name: v20-phase-q-monitor

on:
  pull_request:
    branches: ["main"]
    paths:
      - "research_bot/*v19*.py"
      - "research_bot/*v20*.py"
      - "scripts/*v19*.py"
      - "scripts/*v20*.py"
      - "tests/*v19*.py"
      - "tests/*v20*.py"
      - ".github/workflows/v20-phase-q-monitor.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  PHASE_Q_START_AT: "2026-09-10T13:00:00Z"

jobs:
  phase-q:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run deterministic Phase-Q anti-inflation tests
        run: |
          pytest -q \
            tests/test_phase_q_v20.py \
            tests/test_microstructure_quality_v19.py \
            tests/test_forward_microstructure_v19.py \
            tests/test_trade_timestamp_v19.py
      - name: Harvest immutable v0.19 scheduled artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf artifacts/v20/source_snapshots
          mkdir -p artifacts/v20/source_snapshots
          python scripts/download_v19_forward_artifacts.py \
            --repo "$GITHUB_REPOSITORY" \
            --created-after "$PHASE_Q_START_AT" \
            --output-dir artifacts/v20/source_snapshots \
            --manifest artifacts/v20/artifact_harvest_manifest.json
      - name: Evaluate frozen seven-day data-quality gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            asof="$PHASE_Q_START_AT"
          else
            asof=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi
          python scripts/run_phase_q_v20.py \
            --input-dir artifacts/v20/source_snapshots \
            --as-of "$asof" \
            --output artifacts/v20/phase_q_quality_gate.json \
            --markdown artifacts/v20/PHASE_Q_QUALITY_REPORT.md
      - name: Validate fail-closed Phase-Q contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gate=json.loads(Path('artifacts/v20/phase_q_quality_gate.json').read_text())
          manifest=json.loads(Path('artifacts/v20/artifact_harvest_manifest.json').read_text())
          assert manifest['errors'] == []
          assert gate['protocol']['protocol_version']=='v0.20-phase-q-1'
          assert gate['protocol']['pilot_start_at']=='2026-09-10T13:00:00+00:00'
          assert gate['protocol']['maturity_not_before']=='2026-09-17T13:00:00+00:00'
          assert gate['predictive_modeling_authorized'] is False
          assert gate['paper_strategy_replacement_authorized'] is False
          assert gate['testnet_promotion_authorized'] is False
          assert gate['live_execution_authorized'] is False
          if gate['feature_freeze_authorized']:
              assert gate['data_quality_gate_passed'] is True
              assert gate['core_gate']['elapsed_hours'] >= 168
              assert gate['core_gate']['expected_measurement_opportunities'] >= 336
              for stats in gate['core_gate']['symbols'].values():
                  assert stats['authorized_coverage_ratio'] >= 0.80
                  assert stats['p95_clock_skew_seconds'] <= 60.0
                  assert stats['p95_trade_staleness_seconds'] <= 30.0
              assert gate['next_allowed_action']=='FREEZE_4H_FEATURE_SPEC'
          else:
              assert gate['next_allowed_action']=='CONTINUE_PHASE_Q_COLLECTION'
          print({'decision':gate['decision'],'countable_snapshot_count':gate['countable_snapshot_count'],'unique_slots':gate['core_gate']['unique_measurement_slots'],'expected':gate['core_gate']['expected_measurement_opportunities'],'ledger_sha256':gate['evidence_ledger_sha256']})
          PY
      - name: Upload Phase-Q report and ledger manifest
        uses: actions/upload-artifact@v4
        with:
          name: v20-phase-q-${{ github.run_id }}
          path: |
            artifacts/v20/phase_q_quality_gate.json
            artifacts/v20/PHASE_Q_QUALITY_REPORT.md
            artifacts/v20/artifact_harvest_manifest.json
          retention-days: 90
