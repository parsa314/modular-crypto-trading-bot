name: v08-research-core

on:
  workflow_dispatch:
  push:
    branches: [main, research-v08-advanced-integration]
    paths:
      - "research_bot/**"
      - "tests/test_v08_*.py"
      - "tests/test_*v08.py"
      - "scripts/run_research_core_v08.py"
      - "scripts/run_dynamic_universe_v08.py"
      - "docs/V08_ADVANCED_RESEARCH_INTEGRATION.md"
      - "pyproject.toml"
      - ".github/workflows/v08-research-core.yml"

permissions:
  contents: read

jobs:
  research-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: v0.8 regression tests
        run: pytest -q tests/test_v08_*.py tests/test_*v08.py
      - name: v0.8 engineering smoke
        run: python scripts/run_research_core_v08.py --output-dir artifacts/v08
      - name: Upload v0.8 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v08-research-core
          path: artifacts/v08/**
