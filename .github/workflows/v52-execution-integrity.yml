name: v52-execution-integrity

on:
  push:
    branches: ["execution-hardening-v52"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  execution-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: execution_v52
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d execution_v52"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/execution_v52
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "psycopg[binary]"
      - name: Run execution integrity tests
        run: |
          pytest -q \
            tests/test_execution_hardening_v52.py \
            tests/test_execution_hardening_postgres_v52.py \
            tests/test_order_reconciliation_v52.py \
            tests/test_live_readiness.py \
            tests/test_testnet_execution.py \
            tests/test_okx_demo_transport.py \
            tests/test_nobitex_testnet_transport.py \
            tests/test_forward_paper_v14.py
      - name: Enforce no-LIVE contract
        run: |
          python - <<'PY'
          from research_bot.forward_paper_v14 import ForwardPaperConfig
          from research_bot.execution import ExecutionPolicy
          from research_bot.contracts import ExecutionMode
          assert ExecutionPolicy().mode is ExecutionMode.PAPER
          assert ExecutionPolicy().live_execution_enabled is False
          assert ForwardPaperConfig().max_quote_age_seconds > 0
          print("v0.52 execution safety contract validated")
          PY
