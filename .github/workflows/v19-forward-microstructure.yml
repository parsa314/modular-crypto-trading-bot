name: v19-forward-microstructure

on:
  schedule:
    # Measurement cadence only. The thesis trading/forecast horizon remains 4h.
    # GitHub scheduled jobs may start late under load; actual timestamps are stored.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: v19-forward-microstructure
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Collect prospective fixed-window public REST microstructure snapshot
        run: |
          mkdir -p artifacts/v19/forward
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          python scripts/collect_v19_forward_microstructure.py \
            --trade-window-seconds 60 \
            --output "artifacts/v19/forward/microstructure-${stamp}.json"
      - name: Validate measurement, provenance and no-execution contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from research_bot.integrity_v19 import payload_sha256

          paths=sorted(Path('artifacts/v19/forward').glob('microstructure-*.json'))
          assert len(paths)==1
          z=json.loads(paths[0].read_text())
          assert z['research_status']=='PROSPECTIVE_MULTI_VENUE_MICROSTRUCTURE_COLLECTION_ONLY'
          assert z['measurement_contract']['primary_trading_horizon']=='4h'
          assert z['measurement_contract']['snapshot_measurement_frequency_target']=='30min'
          assert z['measurement_contract']['reported_trade_window_seconds']==60
          assert z['measurement_contract']['rest_snapshot_not_event_stream'] is True
          assert z['signal_authorized'] is False
          assert z['paper_strategy_replacement_authorized'] is False
          assert z['live_execution_authorized'] is False
          assert z['collection_rule']=='prospective_only_fixed_window_no_backfill_no_signal'
          assert z['phase_q_protocol']['protocol_version']=='v0.20-phase-q-1'
          assert z['phase_q_protocol']['pilot_start_at']=='2026-09-10T13:00:00+00:00'
          assert z['phase_q_protocol']['maturity_not_before']=='2026-09-17T13:00:00+00:00'
          assert z['phase_q_protocol']['manual_dispatch_counts_toward_maturity'] is False
          assert z['ci_provenance']['event_name']==os.environ['GITHUB_EVENT_NAME']
          assert z['ci_provenance']['ref']==os.environ['GITHUB_REF']
          assert z['ci_provenance']['sha']==os.environ['GITHUB_SHA']
          assert z['snapshot_sha256']==payload_sha256(z, exclude_keys=('snapshot_sha256',))
          for row in z['symbols']:
              if row.get('feature_authorized'):
                  assert row['trade_window_seconds']==60
                  assert row['trade_side_semantics']=='exchange_reported_side_unverified_aggressor'
                  assert row['venue_clock_skew_seconds'] <= z['config']['max_venue_clock_skew_seconds']
          print({
              'event':z['ci_provenance']['event_name'],
              'ref':z['ci_provenance']['ref'],
              'authorized_symbol_count':z['authorized_symbol_count'],
              'raw_observation_count':z['raw_observation_count'],
              'provider_failures':len(z['provider_failures']),
              'snapshot_sha256':z['snapshot_sha256'],
          })
          PY
      - name: Upload immutable forward snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v19-forward-microstructure-${{ github.run_id }}
          path: artifacts/v19/forward/*.json
          retention-days: 90
