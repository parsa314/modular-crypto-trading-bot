name: master-quant-001
on:
  push:
    branches: [research/master-quant-001-ichimoku]
  pull_request:
    branches: [research/strategy-012-causal-baseline]
    paths:
      - research_bot/quant_001_ichimoku.py
      - tests/test_quant_001_ichimoku.py
      - .github/workflows/master-quant-001.yml
permissions:
  contents: read
jobs:
  causal-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
      BOT_FORWARD_PAPER_ENABLED: 'false'
      BOT_PAPER_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Causality and baseline tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/master-quant-001
          git rev-parse HEAD > artifacts/master-quant-001/checkout-sha.txt
          python --version > artifacts/master-quant-001/python-version.txt
          python -m pip freeze > artifacts/master-quant-001/environment.txt
          pytest -q tests/test_quant_001_ichimoku.py tests/test_strategy_research_012.py tests/test_strategy_regime_012.py tests/test_strategy_labels_012.py tests/test_strategy_data_contract.py tests/test_four_independent_strategies.py --junitxml=artifacts/master-quant-001/junit.xml 2>&1 | tee artifacts/master-quant-001/tests.log
      - name: Hash evidence
        if: always()
        run: |
          mkdir -p artifacts/master-quant-001
          find artifacts/master-quant-001 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > artifacts/master-quant-001/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: master-quant-001-${{ github.sha }}
          path: artifacts/master-quant-001/
