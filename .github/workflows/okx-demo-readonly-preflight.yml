name: okx-demo-readonly-preflight

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Unified CCXT symbol to validate
        required: true
        default: BTC/USDT

permissions:
  contents: read

jobs:
  readonly-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OKX_DEMO_ENABLED: "true"
      OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
      OKX_DEMO_API_SECRET: ${{ secrets.OKX_DEMO_API_SECRET }}
      OKX_DEMO_API_PASSPHRASE: ${{ secrets.OKX_DEMO_API_PASSPHRASE }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Require demo-only credentials
        run: |
          set -euo pipefail
          test -n "$OKX_DEMO_API_KEY"
          test -n "$OKX_DEMO_API_SECRET"
          test -n "$OKX_DEMO_API_PASSPHRASE"

      - name: Run read-only OKX Demo preflight
        run: |
          python scripts/okx_demo_preflight.py --symbol "${{ inputs.symbol }}"
