name: master-v3-stage0-integrity

on:
  pull_request:
    branches: [main, feature/live-ensemble-20261004]
    paths:
      - 'research_bot/execution/**'
      - 'research_bot/research/**'
      - 'research_bot/live_*.py'
      - 'research_bot/service.py'
      - 'configs/**'
      - 'tests/test_foundation.py'
      - 'tests/test_live_*.py'
      - 'tests/test_service_v1.py'
      - 'tests/test_v08_service.py'
      - 'pyproject.toml'
      - '.github/workflows/stage0-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
      BOT_FORWARD_PAPER_ENABLED: 'false'
      BOT_PAPER_EXECUTION_ENABLED: 'false'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Initialize without third-party packages
        run: python -S -m research_bot.execution.foundation
      - name: Install test and existing optional RL dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,rl]'
          python -m pip check
      - name: Verify foundation and existing regression suite
        run: python -m pytest -q
