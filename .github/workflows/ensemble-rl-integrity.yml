name: ensemble-rl-integrity

on:
  pull_request:
    branches: [main, research/causal-ensemble-ppo-20261002, feature/live-ensemble-20261004]
    paths:
      - 'research_bot/ensemble_*.py'
      - 'tests/test_ensemble_*.py'
      - 'research_bot/live_*.py'
      - 'research_bot/execution/**'
      - 'tests/test_live_*.py'
      - 'pyproject.toml'
      - '.github/workflows/ensemble-rl-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
      BOT_FORWARD_PAPER_ENABLED: 'false'
      BOT_PAPER_EXECUTION_ENABLED: 'false'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install optional CPU research stack
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,rl]'
          python -m pip check
      - name: Verify causal research and mocked live execution boundaries
        run: python -m pytest -q tests/test_ensemble_features.py tests/test_ensemble_env.py tests/test_ensemble_agent.py tests/test_ensemble_rl.py tests/test_live_exchange.py tests/test_live_ledger.py tests/test_live_runtime.py tests/test_live_policy.py
      - name: Exercise installed CLI across three folds
        run: python -m research_bot.ensemble_rl --synthetic-bars 800 --initial-train-bars 300 --test-bars 100 --folds 3 --timesteps 128 --seeds 42 --output artifacts/ensemble-smoke
