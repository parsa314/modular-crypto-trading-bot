name: v21-phase-q-monitor

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "29 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  PHASE_Q_V21_START_AT: "2026-09-10T18:00:00Z"

jobs:
  phase-q:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run common-anchor anti-inflation tests
        run: |
          pytest -q tests/test_common_anchor_v21.py tests/test_historical_proxy_v21.py
      - name: Harvest immutable scheduled common-anchor artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf artifacts/v21/source_snapshots
          mkdir -p artifacts/v21/source_snapshots
          python scripts/download_v21_forward_artifacts.py \
            --repo "$GITHUB_REPOSITORY" \
            --created-after "$PHASE_Q_V21_START_AT" \
            --output-dir artifacts/v21/source_snapshots \
            --manifest artifacts/v21/artifact_harvest_manifest.json
      - name: Evaluate frozen common-anchor Phase-Q gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            asof="$PHASE_Q_V21_START_AT"
          else
            asof=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi
          python scripts/run_phase_q_v21.py \
            --input-dir artifacts/v21/source_snapshots \
            --as-of "$asof" \
            --output artifacts/v21/phase_q_quality_gate.json \
            --markdown artifacts/v21/PHASE_Q_COMMON_ANCHOR_REPORT.md
      - name: Validate fail-closed maturity boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          gate=json.loads(Path('artifacts/v21/phase_q_quality_gate.json').read_text())
          manifest=json.loads(Path('artifacts/v21/artifact_harvest_manifest.json').read_text())
          assert manifest['errors']==[]
          assert gate['protocol']['protocol_version']=='v0.21-phase-q-common-anchor-1'
          assert gate['protocol']['pilot_start_at']=='2026-09-10T18:00:00+00:00'
          assert gate['protocol']['maturity_not_before']=='2026-09-17T18:00:00+00:00'
          assert gate['predictive_modeling_authorized'] is False
          assert gate['paper_strategy_replacement_authorized'] is False
          assert gate['testnet_promotion_authorized'] is False
          assert gate['live_execution_authorized'] is False
          if gate['feature_freeze_authorized']:
              assert gate['elapsed_hours'] >= 168
              assert gate['expected_measurement_opportunities'] >= 336
              for stats in gate['symbols'].values():
                  assert stats['authorized_coverage_ratio'] >= 0.80
                  assert stats['p95_book_age_seconds'] <= 20.0
                  assert stats['p95_trade_staleness_seconds'] <= 30.0
          print({'decision':gate['decision'],'slots':gate['countable_unique_slots'],'expected':gate['expected_measurement_opportunities'],'ledger':gate['evidence_ledger_sha256']})
          PY
      - name: Upload Phase-Q monitor evidence
        uses: actions/upload-artifact@v4
        with:
          name: v21-phase-q-${{ github.run_id }}
          path: |
            artifacts/v21/phase_q_quality_gate.json
            artifacts/v21/PHASE_Q_COMMON_ANCHOR_REPORT.md
            artifacts/v21/artifact_harvest_manifest.json
          retention-days: 90
