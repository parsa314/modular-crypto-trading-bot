name: V3 sealed development contract

on:
  push:
    branches: ["research/btcusdt-m15-real-backtest-20261014"]
    paths:
      - ".github/workflows/v3-development-contract.yml"
      - "research_bot/cross_sectional_v3.py"
      - "tests/test_cross_sectional_v3.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'pytest==9.1.1'
      - name: Verify causal rules and cost ledger with invented data only
        run: python -m pytest -q tests/test_cross_sectional_v3.py
