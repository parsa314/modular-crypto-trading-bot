name: ten-strategy-research
on:
  pull_request:
    branches: [main]
    paths:
      - 'research_bot/ten_strategies/**'
      - 'scripts/*ten_strategies*'
      - 'scripts/prepare_binance_archive_1h.py'
      - 'tests/test_ten_strategies*'
      - '.github/workflows/ten-strategy-research.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ten-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
      BOT_FORWARD_PAPER_ENABLED: 'false'
      BOT_PAPER_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify ten-rule contracts and coverage
        run: python -m scripts.verify_ten_strategies_coverage --output artifacts/ten/coverage.json --threshold 80
      - name: Synthetic engineering replay
        run: python -m scripts.run_ten_strategies_research --synthetic --journal artifacts/ten/synthetic.sqlite --output artifacts/ten/synthetic.json
      - name: Public historical data gate then diagnostic replay
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          out=Path("artifacts/ten");out.mkdir(parents=True,exist_ok=True)
          data=out/"BTC_USDT_1h_closed.csv"
          preparation=subprocess.run([sys.executable,"-m","scripts.prepare_binance_archive_1h","--out",str(data)],capture_output=True,text=True,timeout=900)
          (out/"preparation.log").write_text(preparation.stdout+preparation.stderr)
          print(preparation.stdout+preparation.stderr,flush=True)
          gate={"data_exit":preparation.returncode,"status":"BLOCKED_DATA_ACCESS","historical_run":False,"orders_placed":0}
          if preparation.returncode==0:
              replay=subprocess.run([sys.executable,"-m","scripts.run_ten_strategies_research","--csv",str(data),"--journal",str(out/"historical.sqlite"),"--output",str(out/"historical.json")],capture_output=True,text=True,timeout=900)
              (out/"historical.log").write_text(replay.stdout+replay.stderr)
              print(replay.stdout+replay.stderr,flush=True)
              gate.update(status="HISTORICAL_DIAGNOSTIC_COMPLETE" if replay.returncode==0 else "FAILED_RESEARCH",historical_run=True,research_exit=replay.returncode)
          else:
              gate["reason"]=(preparation.stdout+preparation.stderr)[-2000:]
          (out/"data-gate.json").write_text(json.dumps(gate,indent=2)+"\n")
          print(json.dumps(gate),flush=True)
          if gate["status"]=="FAILED_RESEARCH":raise SystemExit(1)
          PY
      - name: Upload actual evidence and blockage if any
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ten-rule-research-evidence
          path: artifacts/ten/
          retention-days: 14
          if-no-files-found: error
