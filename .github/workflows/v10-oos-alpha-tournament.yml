name: v10-oos-alpha-tournament

on:
  workflow_dispatch:
  push:
    branches: [research-v10-oos-alpha-tournament]
    paths:
      - "research_bot/live_eligibility.py"
      - "research_bot/oos_tournament_v10.py"
      - "scripts/run_oos_tournament_v10.py"
      - "tests/test_oos_tournament_v10.py"
      - ".github/workflows/v10-oos-alpha-tournament.yml"

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: v0.10 deterministic tests
        run: |
          pytest -q tests/test_oos_tournament_v10.py tests/test_live_eligibility_v09.py tests/test_v08_*.py tests/test_*v08.py
      - name: Live eligible-universe purged OOS tournament
        run: |
          python scripts/run_oos_tournament_v10.py \
            --exchanges kucoin,okx,mexc,gate,coinex \
            --quotes USDT,USDC,USD \
            --timeframe 4h \
            --max-assets 20 \
            --history-bars 1500 \
            --min-history-bars 1000 \
            --min-volume 5000000 \
            --max-spread-bps 40 \
            --top-quantile 0.25 \
            --cost-bps 12 \
            --label-hurdle-bps 12 \
            --folds 3 \
            --min-assets-per-timestamp 5 \
            --output artifacts/v10/oos_alpha_tournament.json
      - name: Validate OOS evidence artifact
        run: |
          python - <<'PY'
          import json
          p='artifacts/v10/oos_alpha_tournament.json'
          r=json.load(open(p))
          t=r['tournament']
          assert r['discovery']['listings'] > 100, r['discovery']
          assert r['eligibility']['eligible_assets'] >= 5, r['eligibility']['eligible_assets']
          assert t['fold_count'] >= 2, t['fold_count']
          variants={x['variant'] for x in t['summary']}
          required={'logistic','hgb','random_forest','momentum_baseline','ichimoku_baseline','equal_weight_market'}
          assert required.issubset(variants), variants
          assert t['promotion_status'] in {'NO_MODEL_PROMOTED','PROVISIONAL_OOS_WINNER_NEEDS_BOOTSTRAP_AND_MULTI_SEED'}
          text=json.dumps(r).upper()
          assert 'CONFIRMED_ENTRY' not in text
          assert 'BUY_SIGNAL' not in text
          print({'eligible':r['eligibility']['eligible_assets'],'best':t['provisional_best_model'],'promotion':t['promotion_status']})
          PY
      - name: Upload v0.10 OOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: v10-oos-alpha-tournament
          path: artifacts/v10/oos_alpha_tournament.json
