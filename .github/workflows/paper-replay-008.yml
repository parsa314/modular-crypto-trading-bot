name: paper-replay-008-cash-baseline
on:
  push:
    branches: ["feat/executable-paper-bot-008"]
  pull_request:
    branches: ["fix/r1-financial-boundary-006"]
permissions:
  contents: read
jobs:
  historical-cash-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cda9e5ff47d0f40cb62b6734c784317d2f15e405
          path: source-data
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]' pyarrow
      - name: Tests and historical cash-only replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/paper-008
          git rev-parse HEAD > artifacts/paper-008/checkout-sha.txt
          git -C source-data rev-parse HEAD > artifacts/paper-008/data-source-sha.txt
          python --version > artifacts/paper-008/python-version.txt
          python -m pip freeze > artifacts/paper-008/environment.txt
          pytest -q tests/test_paper_replay_008.py tests/test_paper_ledger_008.py tests/test_paper_risk_009.py tests/test_paper_fee_009.py tests/test_paper_crash_009.py tests/test_strategy_data_contract.py tests/test_four_independent_strategies.py tests/test_forward_paper_v14.py tests/test_v08_orchestrator.py tests/test_recovery_acceptance.py tests/test_operational_risk.py tests/test_release_control.py tests/test_execution_hardening_v52.py tests/test_order_reconciliation_v52.py --junitxml=artifacts/paper-008/junit.xml 2>&1 | tee artifacts/paper-008/tests.log
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd
          p=Path('source-data/data/btc_usdt_m15_2022_2024.parquet')
          manifest=json.loads(Path('source-data/data/btc_usdt_m15_2022_2024.manifest.json').read_text())
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest == manifest['output_sha256'] == 'f7bf84ccaff343dbb627c17e6245ae6f2488f940a3ed6867efd262115ea9d401'
          df=pd.read_parquet(p)
          df['timestamp']=pd.to_datetime(df.timestamp,utc=True)
          assert df.timestamp.is_unique and df.timestamp.is_monotonic_increasing
          df=df[(df.timestamp >= '2024-12-01T00:00:00Z') & (df.timestamp < '2024-12-05T00:00:00Z')]
          groups=df.groupby(df.timestamp.dt.floor('h'),sort=True)
          assert len(groups)==96
          rows=[]
          for stamp, group in groups:
              assert len(group)==4 and set(group.timestamp.dt.minute)=={0,15,30,45}
              rows.append({'timestamp':stamp,'open':group.open.iloc[0],'high':group.high.max(),
                           'low':group.low.min(),'close':group.close.iloc[-1],'volume':group.volume.sum()})
          pd.DataFrame(rows).to_csv('artifacts/paper-008/btcusdt-h1.csv',index=False)
          Path('artifacts/paper-008/input-parquet-sha256.txt').write_text(digest+'\n')
          PY
          python -m research_bot.paper_replay_008 --csv artifacts/paper-008/btcusdt-h1.csv --state artifacts/paper-008/state.sqlite --as-of '2024-12-05T00:00:00+00:00' --source 'Binance Vision spot BTCUSDT M15 resampled H1; source commit cda9e5ff47d0f40cb62b6734c784317d2f15e405' --fee-bps 10 --spread-bps 3 --slippage-bps 2 | tee artifacts/paper-008/first.json
          python -m research_bot.paper_replay_008 --csv artifacts/paper-008/btcusdt-h1.csv --state artifacts/paper-008/state.sqlite --as-of '2024-12-05T00:00:00+00:00' --source 'Binance Vision spot BTCUSDT M15 resampled H1; source commit cda9e5ff47d0f40cb62b6734c784317d2f15e405' --fee-bps 10 --spread-bps 3 --slippage-bps 2 | tee artifacts/paper-008/restart.json
          python - <<'PY'
          import json
          a=json.load(open('artifacts/paper-008/first.json'))
          b=json.load(open('artifacts/paper-008/restart.json'))
          assert a['new_record'] and not b['new_record'] and a['run_id']==b['run_id']
          assert a['decision']=='NO_TRADE' and a['fills']==0
          PY
      - name: Hash evidence
        if: always()
        run: |
          mkdir -p artifacts/paper-008
          find artifacts/paper-008 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > artifacts/paper-008/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-replay-008-${{ github.sha }}
          path: artifacts/paper-008/
          if-no-files-found: warn
  repository-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: execution_v52
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d execution_v52"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci-only@127.0.0.1:5432/execution_v52
      RECOVERY_TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci-only@127.0.0.1:5432/recovery_test
      NEXT_GATE_ISOLATED_DATABASE: "1"
      LIVE_EXECUTION: "false"
      PAPER_EXECUTION: "false"
      BOT_FORWARD_PAPER_ENABLED: "false"
      BOT_PAPER_EXECUTION_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Prepare isolated databases
        run: |
          mkdir -p artifacts/paper-009-full
          git rev-parse HEAD > artifacts/paper-009-full/checkout-sha.txt
          python --version > artifacts/paper-009-full/python-version.txt
          python -m pip freeze > artifacts/paper-009-full/environment.txt
          python - <<'PY'
          import os, psycopg
          from pathlib import Path
          with psycopg.connect(os.environ['TEST_DATABASE_URL'],autocommit=True,connect_timeout=5) as conn:
              row=conn.execute('SELECT version(),current_database()').fetchone()
              assert row[1]=='execution_v52'
              conn.execute('CREATE DATABASE recovery_test')
          Path('artifacts/paper-009-full/postgres.txt').write_text(str(row))
          PY
      - name: Full repository regression with outbound network blocked
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          pg_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ${{ job.services.postgres.id }})"
          python -c 'import ipaddress,sys; assert ipaddress.ip_address(sys.argv[1]).is_private' "$pg_ip"
          sudo iptables -I OUTPUT 1 -j REJECT
          trap 'sudo iptables -D OUTPUT -j REJECT' EXIT
          sudo iptables -I OUTPUT 1 -d 127.0.0.0/8 -j ACCEPT
          trap 'sudo iptables -D OUTPUT -d 127.0.0.0/8 -j ACCEPT; sudo iptables -D OUTPUT -j REJECT' EXIT
          sudo iptables -I OUTPUT 1 -d "$pg_ip" -p tcp --dport 5432 -j ACCEPT
          trap 'sudo iptables -D OUTPUT -d "$pg_ip" -p tcp --dport 5432 -j ACCEPT; sudo iptables -D OUTPUT -d 127.0.0.0/8 -j ACCEPT; sudo iptables -D OUTPUT -j REJECT' EXIT
          sudo ip6tables -I OUTPUT 1 ! -d ::1/128 -j REJECT
          trap 'sudo ip6tables -D OUTPUT ! -d ::1/128 -j REJECT; sudo iptables -D OUTPUT -d "$pg_ip" -p tcp --dport 5432 -j ACCEPT; sudo iptables -D OUTPUT -d 127.0.0.0/8 -j ACCEPT; sudo iptables -D OUTPUT -j REJECT' EXIT
          python - <<'PY'
          import os,psycopg
          for key in ('TEST_DATABASE_URL','RECOVERY_TEST_DATABASE_URL'):
              with psycopg.connect(os.environ[key],connect_timeout=5) as c:
                  print('FIREWALL_POSTGRES_PREFLIGHT',key,c.execute('SELECT current_database()').fetchone()[0],flush=True)
          PY
          pytest -q tests/ tests/checks_pg_recovery.py --junitxml=artifacts/paper-009-full/junit.xml 2>&1 | tee artifacts/paper-009-full/pytest.log
      - name: Hash evidence
        if: always()
        run: |
          mkdir -p artifacts/paper-009-full
          find artifacts/paper-009-full -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > artifacts/paper-009-full/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-009-full-${{ github.sha }}
          path: artifacts/paper-009-full/
          if-no-files-found: warn
