name: V4 numeric train-val fixed-20 challenger 2022-24 (no Test-3)
on:
  push:
    branches: ["research/v4-trainval-execution-20261015"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  v4-numbers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Execute empirical train and validation ONLY, no 2025 data
        run: python scripts/execute_v4_fixed20_trainval.py
      - name: Persist numeric output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/v4_fixed20_trainval.json
          git commit -m "results: measured v4 2022-2024 validation numbers" || exit 0
          git push origin HEAD:research/v4-trainval-execution-20261015
