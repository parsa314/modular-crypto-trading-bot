name: MT5 Demo Bridge Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research_bot/execution_adapters/**"
      - "research_bot/tradingview_mt5_bridge.py"
      - "research_bot/tradingview_mt5_service.py"
      - "research_bot/demo_experience.py"
      - "scripts/run_tv_mt5_bridge.py"
      - "scripts/mt5_demo_smoke.py"
      - "tests/test_mt5_demo_adapter.py"
      - "tests/test_tradingview_mt5_bridge.py"
      - "tests/test_demo_experience.py"
      - "pyproject.toml"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test environment
        run: python -m pip install -e ".[dev]"
      - name: Compile bridge modules
        run: |
          python -m compileall -q research_bot/execution_adapters
          python -m compileall -q research_bot/tradingview_mt5_bridge.py
          python -m compileall -q research_bot/tradingview_mt5_service.py
          python -m compileall -q research_bot/demo_experience.py
      - name: Run focused tests
        run: |
          pytest -q             tests/test_mt5_demo_adapter.py             tests/test_tradingview_mt5_bridge.py             tests/test_demo_experience.py
