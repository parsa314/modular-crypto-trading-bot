name: production-postgres-phase2a
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-postgres-fake-exchange:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: convergence_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: convergence_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U convergence_test -d convergence_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CONVERGENCE_TEST_DATABASE_URL: postgresql://convergence_test:local-test-only@127.0.0.1:5432/convergence_test
      TEST_DATABASE_URL: postgresql://convergence_test:local-test-only@127.0.0.1:5432/convergence_test
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
      TESTNET_EXECUTION: 'false'
      BOT_FORWARD_PAPER_ENABLED: 'false'
      BOT_PAPER_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,data]' 'pyyaml>=6,<7'
      - name: PostgreSQL version and required test-DSN preflight
        run: |
          python - <<'PY'
          import os, psycopg
          assert os.environ['CONVERGENCE_TEST_DATABASE_URL']
          with psycopg.connect(os.environ['CONVERGENCE_TEST_DATABASE_URL']) as conn:
              assert 160000 <= conn.info.server_version < 170000
          PY
      - name: PostgreSQL atomicity, migration, SIGKILL and V52 regression
        run: python -m pytest -q tests/test_convergence_postgres.py tests/test_postgres_authorization.py tests/test_execution_hardening_postgres_v52.py
      - name: Full regression with real PostgreSQL tests enabled
        run: python -m pytest -q
      - name: Compile, config and YAML
        run: |
          python -m compileall -q research_bot scripts
          python - <<'PY'
          from pathlib import Path
          import yaml
          from research_bot.execution.constitution import RISK_CONSTITUTION_V1 as R, RiskConstitution
          assert RiskConstitution.from_json(R.canonical_json()).sha256 == R.sha256
          for p in Path('.github/workflows').glob('*.yml'):
              assert isinstance(yaml.safe_load(p.read_text()), dict)
          assert isinstance(yaml.safe_load(Path('compose.postgres-test.yml').read_text()), dict)
          PY
