name: ML real signals and XGBoost meta label evaluation
on:
  push:
    branches: ["research/ml-meta-label-20261016"]
    paths:
      - "scripts/ml_meta_label_experiment.py"
      - "tests/test_ml_meta_label.py"
      - ".github/workflows/ml-meta-label.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  measure-samples-and-fit-meta-labeler:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real ML dependencies (no GPU/RL)
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'pyarrow>=16,<25' 'scikit-learn>=1.5,<2' 'xgboost>=3,<4' 'pytest>=8,<10'
      - name: Run invariant tests
        run: PYTHONPATH=.:src pytest -q tests/test_ml_meta_label.py
      - name: Download actual Spot public klines, count and learn; never authenticate
        run: PYTHONPATH=. python scripts/ml_meta_label_experiment.py
      - name: Publish actual signals and measured numeric results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/signals.parquet results/signal_count.json results/ml_data_decision.json results/ml_comparison.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results(ml): 50 asset source-audited signal counts, triple-barrier labels and learned MetaLabel metrics"
          git push origin HEAD:research/ml-meta-label-20261016
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-50-symbol-real-data-experiment
          path: |
            results/signal_count.json
            results/ml_data_decision.json
            results/ml_comparison.json
            results/signals.parquet
          if-no-files-found: warn
