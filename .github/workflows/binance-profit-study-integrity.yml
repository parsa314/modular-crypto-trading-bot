name: binance-profit-study-integrity
on:
  pull_request:
    paths:
      - "research_bot/research/**"
      - "tests/test_profit*.py"
      - "tests/test_spot_history.py"
      - "configs/binance_profit_study.json"
      - ".github/workflows/binance-profit-study-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-study:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev,data]'
      - run: python -m pytest -q tests/test_spot_history.py tests/test_profit_features.py tests/test_profit_model.py tests/test_profit_backtest.py tests/test_profit_pipeline.py
