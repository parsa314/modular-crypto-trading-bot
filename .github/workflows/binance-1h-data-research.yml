name: binance-1h-data-research
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/prepare_binance_1h.py'
      - 'scripts/run_four_systems_research.py'
      - 'research_bot/four_systems/binance_history.py'
      - '.github/workflows/binance-1h-data-research.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: binance-1h-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  data-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
      BOT_FORWARD_PAPER_ENABLED: 'false'
      BOT_PAPER_EXECUTION_ENABLED: 'false'
      PUBLIC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install project environment
        run: python -m pip install -e '.[dev]'
      - name: Prepare real data, then research only if validated
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          out=Path("artifacts/binance-1h")
          out.mkdir(parents=True,exist_ok=True)
          csv=Path("data/historical/BTC_USDT_1h_closed.csv")
          prep=subprocess.run([sys.executable,"-m","scripts.prepare_binance_1h","--years","3","--out",str(csv)],capture_output=True,text=True,timeout=900)
          (out/"preparation.log").write_text(prep.stdout+prep.stderr)
          result={"source_sha":os.environ["PUBLIC_SOURCE_SHA"],"status":"VALIDATED_DATA" if prep.returncode==0 else "BLOCKED_OR_INVALID_DATA",
              "data_preparation_exit":prep.returncode,"csv_exists":csv.exists(),"RESEARCH_ONLY":True,"PAPER_EXECUTION":False,"LIVE_EXECUTION":False,
              "economic_validation":False,"prospective_evidence":False,"dsr_status":"NOT_RUN","pbo_status":"NOT_RUN"}
          if prep.returncode==0 and csv.exists():
              research=subprocess.run([sys.executable,"-m","scripts.run_four_systems_research","--csv",str(csv),
                  "--journal",str(out/"historical.sqlite"),"--output",str(out/"historical-report.json")],capture_output=True,text=True,timeout=900)
              (out/"research.log").write_text(research.stdout+research.stderr)
              result["research_exit"]=research.returncode
              result["status"]="HISTORICAL_CONTEXT_REPORTED" if research.returncode==0 else "FAILED_HISTORICAL_RESEARCH"
          else:
              result["reason"]="Public Binance preparation failed; no historical model or synthetic fallback was run. See preparation.log."
          (out/"data-gate.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result))
          PY
      - name: Upload data and truthful gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binance-btc-usdt-1h-research
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/binance-1h/
            data/historical/BTC_USDT_1h_closed.csv
            data/historical/BTC_USDT_1h_closed.manifest.json
      - name: Require valid data and historical report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/binance-1h/data-gate.json")
          if not p.exists():
              raise SystemExit("Data workflow failed before a gate report; no data/model result is established")
          r=json.loads(p.read_text())
          if r["status"]!="HISTORICAL_CONTEXT_REPORTED":
              raise SystemExit(r["status"]+": data/research gate is incomplete; not an economic rejection")
          PY
