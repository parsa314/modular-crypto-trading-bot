name: strategy-research-012
on:
  push:
    branches: [research/strategy-012-causal-baseline]
  pull_request:
    branches: [feat/executable-paper-bot-008]
    paths:
      - research_bot/strategy_research_012.py
      - tests/test_strategy_research_012.py
      - scripts/strategy_012_probe.py
      - .github/workflows/strategy-research-012.yml
permissions:
  contents: read
jobs:
  research-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
      BOT_FORWARD_PAPER_ENABLED: 'false'
      BOT_PAPER_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cda9e5ff47d0f40cb62b6734c784317d2f15e405
          path: source-data
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' pyarrow
      - name: Synthetic checks and non-prospective historical baseline smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/strategy-012
          git rev-parse HEAD > artifacts/strategy-012/checkout-sha.txt
          git -C source-data rev-parse HEAD > artifacts/strategy-012/source-sha.txt
          python --version > artifacts/strategy-012/python-version.txt
          python -m pip freeze > artifacts/strategy-012/environment.txt
          pytest -q tests/test_strategy_research_012.py tests/test_strategy_data_contract.py tests/test_four_independent_strategies.py --junitxml=artifacts/strategy-012/junit.xml 2>&1 | tee artifacts/strategy-012/tests.log
          python scripts/strategy_012_probe.py source-data/data/btc_usdt_m15_2022_2024.parquet source-data/data/btc_usdt_m15_2022_2024.manifest.json artifacts/strategy-012/historical-smoke.json | tee artifacts/strategy-012/smoke.log
      - name: Hash evidence
        if: always()
        run: |
          mkdir -p artifacts/strategy-012
          find artifacts/strategy-012 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > artifacts/strategy-012/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-012-${{ github.sha }}
          path: artifacts/strategy-012/
