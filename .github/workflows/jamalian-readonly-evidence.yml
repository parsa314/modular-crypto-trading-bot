name: jamalian-readonly-evidence
on:
  pull_request:
    branches: [main, research/jamalian-course-integration-2026-10-11]
    paths:
      - 'research_bot/decision_trace.py'
      - 'research_bot/four_systems/features.py'
      - 'scripts/run_readonly_evidence_cycle.py'
      - 'tests/test_readonly_evidence_cycle.py'
      - 'tests/test_decision_trace.py'
      - 'tests/test_causal_evidence_guard.py'
      - '.github/workflows/jamalian-readonly-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
      BOT_FORWARD_PAPER_ENABLED: 'false'
      BOT_PAPER_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Bounded research-only cycle, reason codes and four-family causality
        run: |
          python -m pytest -q \
            tests/test_readonly_evidence_cycle.py \
            tests/test_decision_trace.py \
            tests/test_causal_evidence_guard.py \
            tests/test_jamalian_phase_one.py
