name: v18-cost-aware-regime

on:
  push:
    branches: ["v18-cost-aware-regime-replication"]
  pull_request:
    branches: ["main"]
    paths:
      - "research_bot/*v18*.py"
      - "scripts/*v18*.py"
      - "tests/*v18*.py"
      - "docs/V18*.md"
      - ".github/workflows/v18-cost-aware-regime.yml"
  workflow_dispatch:

jobs:
  v18-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q tests/test_cost_regime_v18.py tests/test_evidence_ledger_v17.py tests/test_trial_registry_v17.py
      - name: Run v0.18 live public-data experiments
        run: python scripts/run_v18_cost_regime.py --bars 1800 --output artifacts/v18/v18_cost_regime_results.json
      - name: Render v0.18 results
        run: python scripts/render_v18_results.py --input artifacts/v18/v18_cost_regime_results.json --output artifacts/v18/V18_RESULTS.md
      - name: Validate fail-closed result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/v18/v18_cost_regime_results.json')
          z=json.loads(p.read_text())
          assert z['version']=='v0.18'
          assert z['experiment_a']['decision'] in {'COST_AWARE_CONVERSION_SUPPORTED','NO_COST_AWARE_CONVERSION_EVIDENCE'}
          assert z['experiment_b']['decision'] in {'EXTERNAL_REGIME_REPLICATION_SUPPORTED','NO_EXTERNAL_REGIME_REPLICATION_EVIDENCE'}
          assert z['combined_decision']['live_execution_authorized'] is False
          assert z['combined_decision']['paper_strategy_promotion_authorized'] is False
          md=Path('artifacts/v18/V18_RESULTS.md').read_text(encoding='utf-8')
          assert 'no PAPER replacement or LIVE authorization' in md
          print(json.dumps({'A': z['experiment_a']['decision'],'B': z['experiment_b']['decision'],'external': z['experiment_b_external_source']}, indent=2))
          PY
      - name: Upload v0.18 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v18-cost-aware-regime-results
          path: |
            artifacts/v18/v18_cost_regime_results.json
            artifacts/v18/V18_RESULTS.md
          retention-days: 90
