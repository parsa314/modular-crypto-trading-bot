name: V5 numeric train-val fixed20 RSI 2022-24 (no Test-3)
on:
  push:
    branches: ["research/v5-trainval-execution-20261015"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  numeric-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Execute market-only 2022-24, NEVER 2025+
        run: python -m scripts.execute_v5_fixed20_trainval
      - name: Commit measured results only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/v5_fixed20_trainval.json
          git commit -m "results: measured v5 2022-24 validation numbers" || exit 0
          git push origin HEAD:research/v5-trainval-execution-20261015
