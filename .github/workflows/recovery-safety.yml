name: recovery-safety

on:
  pull_request:
    paths:
      - research_bot/operational_risk.py
      - research_bot/orchestrator.py
      - research_bot/testnet_execution.py
      - research_bot/release_control.py
      - tests/test_recovery_acceptance.py
      - tests/test_operational_risk.py
      - tests/test_release_control.py
      - tests/checks_pg_recovery.py
      - .github/workflows/recovery-safety.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recovery_test
          POSTGRES_USER: recovery_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U recovery_test -d recovery_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
      BOT_FORWARD_PAPER_ENABLED: 'false'
      BOT_PAPER_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install canonical development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Engineering and isolated PostgreSQL gates
        env:
          RECOVERY_TEST_DATABASE_URL: postgresql://recovery_test:ephemeral-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/recovery_test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/recovery-ci
          python -m pip freeze > artifacts/recovery-ci/environment.txt
          git rev-parse HEAD > artifacts/recovery-ci/source-sha.txt
          python -m unittest discover -s tests -p test_recovery_acceptance.py -v 2>&1 | tee artifacts/recovery-ci/acceptance.log
          python -m unittest discover -s tests -p test_operational_risk.py -v 2>&1 | tee artifacts/recovery-ci/risk.log
          python -m unittest discover -s tests -p test_release_control.py -v 2>&1 | tee artifacts/recovery-ci/release.log
          python -m unittest discover -s tests -p checks_pg_recovery.py -v 2>&1 | tee artifacts/recovery-ci/postgres.log
          pytest -q tests/test_testnet_execution.py 2>&1 | tee artifacts/recovery-ci/oms-regression.log
      - name: Preserve evidence on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-safety-${{ github.sha }}
          path: artifacts/recovery-ci/
          if-no-files-found: error
          retention-days: 30
