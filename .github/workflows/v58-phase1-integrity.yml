name: v58 phase1 integrity

on:
  push:
    branches:
      - research/v58-implementation-phase1
    paths:
      - 'research_bot/v58/**'
      - 'tests/v58/**'
      - 'V58_DATA_MANIFEST.json'
      - '.github/workflows/v58-phase1-integrity.yml'
  pull_request:
    paths:
      - 'research_bot/v58/**'
      - 'tests/v58/**'
      - 'V58_DATA_MANIFEST.json'

permissions:
  contents: read

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
      BOT_FORWARD_PAPER_ENABLED: 'false'
      BOT_PAPER_EXECUTION_ENABLED: 'false'
      EXECUTION_MODE: RESEARCH_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q research_bot/v58 tests/v58
      - run: python -m pytest -q tests/v58
