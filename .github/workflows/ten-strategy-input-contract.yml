name: ten-strategy-input-contract
on:
  pull_request:
    branches: [main, research/jamalian-course-integration-2026-10-11]
    paths:
      - 'scripts/run_ten_strategies_research.py'
      - 'tests/test_ten_cli_guard.py'
      - 'tests/test_ten_strategies.py'
      - '.github/workflows/ten-strategy-input-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIVE_EXECUTION: 'false'
      PAPER_EXECUTION: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Reproduce upstream failed test and verify missing/empty inputs
        run: |
          python -m pytest -q tests/test_ten_cli_guard.py \
            tests/test_ten_strategies.py
