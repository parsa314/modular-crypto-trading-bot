name: v09-live-eligibility

on:
  workflow_dispatch:
  push:
    branches: [research-v09-live-eligibility]
    paths:
      - "research_bot/live_eligibility.py"
      - "research_bot/market_discovery.py"
      - "research_bot/fast_scanner.py"
      - "scripts/run_live_eligibility_v09.py"
      - "tests/test_live_eligibility_v09.py"
      - ".github/workflows/v09-live-eligibility.yml"

permissions:
  contents: read

jobs:
  eligibility-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: v0.9 deterministic regression tests
        run: pytest -q tests/test_live_eligibility_v09.py tests/test_v08_*.py tests/test_*v08.py
      - name: Live public eligibility audit and fast scan
        run: |
          python scripts/run_live_eligibility_v09.py \
            --exchanges kucoin,okx,mexc,gate,coinex \
            --quotes USDT,USDC,USD \
            --timeframe 4h \
            --history-bars 650 \
            --max-assets 30 \
            --min-volume 2000000 \
            --max-spread-bps 40 \
            --min-history-bars 500 \
            --candidate-quantile 0.80 \
            --output artifacts/v09/live_eligibility_scan.json
      - name: Validate artifact has real audited coverage
        run: |
          python - <<'PY'
          import json
          p='artifacts/v09/live_eligibility_scan.json'
          r=json.load(open(p))
          assert r['discovery']['listings'] > 100, r['discovery']
          assert r['selected_for_audit'] >= 10, r['selected_for_audit']
          assert r['eligible_assets'] >= 5, r['rejection_counts']
          assert len(r['scan_rows']) >= 5, len(r['scan_rows'])
          assert all(x.get('status') != 'CONFIRMED_ENTRY' for x in r['scan_rows'])
          print({'eligible_assets':r['eligible_assets'],'candidates':len(r['deep_analysis_candidates'])})
          PY
      - name: Upload v0.9 evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: v09-live-eligibility
          path: artifacts/v09/live_eligibility_scan.json
