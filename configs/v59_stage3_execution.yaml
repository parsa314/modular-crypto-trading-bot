    - BEST_BID
    - BEST_ASK
    - DEPTH_NOTIONAL_10BPS
  stress_components:
    taker_fee_bps_per_side: 5.0
    slippage_bps_per_side: 2.0
    latency_bps_per_side: 1.0
    impact_coefficient_bps: 8.0
    max_impact_bps_per_side: 50.0
