[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-crypto-research-bot"
version = "1.0.0rc3"
description = "Evidence-driven modular cryptocurrency trading research and monitoring platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ccxt==4.5.77",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pyarrow>=16,<25"]
ml = [
  "xgboost>=3.0,<4",
  "lightgbm>=4.5,<5",
  "catboost>=1.2,<2",
  "hmmlearn>=0.3,<0.4",
]
deep = [
  "torch>=2.14,<2.15",
  "torchvision>=0.21,<1",
  "pillow>=10,<13",
]
mamba = [
  "torch>=2.14,<2.15",
  "mamba-ssm==2.3.2.post1",
]
rl = [
  "gymnasium>=1.0,<2",
  "stable-baselines3>=2.6,<3",
]
ai = [
  "xgboost>=3,<4",
  "lightgbm>=4.5,<5",
  "hmmlearn>=0.3,<0.4",
  "pyarrow>=16,<25",
  "gymnasium>=1,<2",
  "stable-baselines3>=2.6,<3",
  "torch>=2.8,<3",
  "filelock>=3,<4",
  "websockets>=15,<17",
]
mt5 = [
  "MetaTrader5>=5.0,<6; sys_platform == 'win32'",
  "mt5forge==1.0.3; sys_platform == 'win32' and python_version >= '3.12'",
]
validation = ["purgedcv==0.1.11; python_version >= '3.11'"]

[tool.setuptools.packages.find]
include = ["research_bot*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
